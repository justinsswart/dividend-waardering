name: Dagelijkse herwaardering
on:
  schedule:
    - cron: "30 17 * * 1-5"   # 19:30 NL, na Euronext-slot
  workflow_dispatch:
jobs:
  bouw:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance pandas
      - run: python fetch.py
      - run: python agenda.py
        continue-on-error: true
      - run: python guidance.py --verouderd
        continue-on-error: true
      - run: python valuate.py
      - run: python nieuws.py
        continue-on-error: true
      - run: python build.py
      - name: Vastleggen
        run: |
          git config user.name "waarderingsbot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html data.json raw.json signalen.json voorstellen.json agenda.json
          git diff --staged --quiet || git commit -m "Herwaardering $(date +%F)"
          git push
